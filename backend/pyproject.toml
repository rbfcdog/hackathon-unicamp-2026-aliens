[project]
name = "enter-os"
version = "0.1.0"
description = "FastAPI backend for auditable legal settlement recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "joblib>=1.5.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.7.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "xgboost-cpu>=3.0.0",
    "pymupdf4llm>=1.28.2",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]
